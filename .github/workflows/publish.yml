# Publishes the OGToolz.Atlas* packages to nuget.org using Trusted Publishing (OIDC).
# No API key is stored: NuGet/login exchanges the GitHub OIDC token for a 1-hour key.
#
# Release: bump <Version> in Directory.Build.props, commit, then push a matching tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# The nuget.org trusted publishing policy must match: owner ajs-uk-dev, repo Atlas,
# workflow file publish.yml, environment release.
name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for the OIDC token exchange with nuget.org

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(dotnet msbuild src/Atlas/Atlas.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props"
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ajs-uk-dev # nuget.org profile name, not email

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
